<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book app</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 2rem;
        background: #f4f1ea;
      }

      h1 {
        text-align: center;
        color: #243447;
      }

      .cart-controls {
        max-width: 820px;
        margin: 0 auto 1rem;
        text-align: right;
      }

      button {
        padding: 0.65rem 0.9rem;
        border: 0;
        border-radius: 5px;
        background: #243447;
        color: white;
        cursor: pointer;
      }

      button:hover {
        background: #b24c32;
      }

      .booklist {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 1.5rem;
      }

      .card {
        width: 180px;
        padding: 1rem;
        text-align: center;
        background: white;
        border: 1px solid #d8d2c4;
        border-radius: 8px;
        box-shadow: 0 3px 10px rgb(0 0 0 / 10%);
      }

      .img {
        object-fit: cover;
      }

      .card h2 {
        font-size: 1.1rem;
        color: #243447;
      }

      .card p {
        color: #b24c32;
        font-weight: bold;
      }

      .cart {
        max-width: 820px;
        margin: 0 auto 1.5rem;
        padding: 1rem 1.5rem;
        background: white;
        border: 1px solid #d8d2c4;
        border-radius: 8px;
      }

      .cart h2 {
        margin-top: 0;
      }

      .cart li {
        margin: 0.5rem 0;
      }
    </style>
  </head>
  <body>
    <h1>Book Store</h1>
    <div id="root"></div>

    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.production.min.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"
    ></script>
    <script src="./bookapp.js"></script>
  </body>
</html>
